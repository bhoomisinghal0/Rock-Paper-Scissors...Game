<!DOCTYPE html>
<html>

<head>
    <title>
        Rock Paper Scissors game
    </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p class="heading"><u>Rock Paper Scissors</u></p>
    <div class="details">
    <button class="move-button"  onclick="
            setting_move();
            output_game('rock');

        "><img class="icons" src="icons/rock-emoji.png"></button>
    <button class="move-button" onclick="
            setting_move();
            output_game('paper');

    "><img class="icons" src="icons/paper-emoji.png"></button>
    <button class="move-button" onclick="
            setting_move();
            output_game('scissors');
       
    "><img class="icons" src="icons/scissors-emoji.png"></button>
    <div class="result-info">
    <p class="js-status">
       
    </p>
    <p class="js-move"></p>
    <p class="js-score"></p>
    <button class="res-but" onclick="
    score.Win=0;
    score.Tie=0;
    score.Lose=0;
     document.querySelector('.js-status').style.color='white';
    localStorage.removeItem('score');
    document.querySelector('.js-move').innerHTML='';
    document.querySelector('.js-status').innerHTML=`'Game is Reset'`;
     document.querySelector('.js-score').innerHTML=`Win:${score.Win}  Tie:${score.Tie}  Lose:${score.Lose}`;

    //to remove previous stored values in localStorage
    ">Reset Score</button>
    </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
